<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supabase CRUD Manager</title>
  <!-- Google Fonts: Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #10b981;
      --primary-hover: #059669;
      --primary-light: rgba(16, 185, 129, 0.1);
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --accent: #3b82f6;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      width: 100%;
      max-width: 800px;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      background: linear-gradient(135deg, #34d399 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    .subtitle {
      color: var(--text-muted);
      font-size: 1rem;
    }

    main {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3), 0 4px 6px -4px rgba(0, 0, 0, 0.3);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    label {
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    input, textarea {
      background-color: var(--bg-dark);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      color: var(--text-main);
      font-family: inherit;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    button {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0b0f19;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: var(--border);
      color: var(--text-main);
      margin-left: 0.5rem;
    }

    .btn-secondary:hover {
      background-color: #475569;
    }

    .btn-danger {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.2);
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }

    .btn-danger:hover {
      background-color: rgba(239, 68, 68, 0.1);
      border-color: var(--danger);
    }

    .btn-edit {
      background-color: transparent;
      color: var(--accent);
      border: 1px solid rgba(59, 130, 246, 0.2);
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }

    .btn-edit:hover {
      background-color: rgba(59, 130, 246, 0.1);
      border-color: var(--accent);
    }

    .items-container {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item-card {
      background-color: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      transition: transform 0.2s, border-color 0.2s;
    }

    .item-card:hover {
      transform: translateY(-2px);
      border-color: #475569;
    }

    .item-details {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .item-name {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .item-description {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .item-actions {
      display: flex;
      gap: 0.5rem;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
    }

    .empty-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      padding: 1rem 1.5rem;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transform: translateY(150%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 0.75rem;
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
    }

    .toast-success {
      border-left: 4px solid var(--primary);
    }

    .toast-error {
      border-left: 4px solid var(--danger);
    }

    /* Loading Spinner */
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border-left-color: var(--primary);
      animation: spin 1s linear infinite;
      display: inline-block;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 600px) {
      .item-card {
        flex-direction: column;
        gap: 1rem;
      }
      .item-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>Supabase CRUD Board</h1>
    <p class="subtitle">A secure NodeJS connection running directly from DroidDeploy</p>
  </header>

  <main>
    <!-- CRUD Form Card -->
    <div class="card">
      <h2 id="form-title">Create New Entry</h2>
      <form id="item-form">
        <input type="hidden" id="item-id">
        <div class="form-group">
          <label for="item-name">Name</label>
          <input type="text" id="item-name" placeholder="E.g., Complete Project Alpha" required>
        </div>
        <div class="form-group">
          <label for="item-description">Description</label>
          <textarea id="item-description" rows="3" placeholder="Provide details about the item..."></textarea>
        </div>
        <div>
          <button type="submit" id="submit-btn" class="btn-primary">Add Item</button>
          <button type="button" id="cancel-btn" class="btn-secondary" style="display: none;">Cancel</button>
        </div>
      </form>
    </div>

    <!-- Items Listing Card -->
    <div class="card">
      <h2>Database Entries</h2>
      <div id="items-list" class="items-container">
        <!-- Loader -->
        <div style="text-align: center; padding: 2rem;">
          <div class="spinner"></div> Loading database entries...
        </div>
      </div>
    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="toast">
    <span id="toast-message">Action completed successfully.</span>
  </div>

  <script>
    const API_URL = '/api/items';
    const itemForm = document.getElementById('item-form');
    const itemIdInput = document.getElementById('item-id');
    const itemNameInput = document.getElementById('item-name');
    const itemDescInput = document.getElementById('item-description');
    const submitBtn = document.getElementById('submit-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const formTitle = document.getElementById('form-title');
    const itemsList = document.getElementById('items-list');
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-message');

    let isEditing = false;

    // Load items on page load
    document.addEventListener('DOMContentLoaded', fetchItems);

    // Fetch and render items
    async function fetchItems() {
      try {
        const response = await fetch(API_URL);
        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Failed to fetch items');
        }
        const items = await response.json();
        renderItems(items);
      } catch (error) {
        showToast(error.message, 'error');
        itemsList.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>${error.message}</p></div>`;
      }
    }

    // Render items
    function renderItems(items) {
      if (!items || items.length === 0) {
        itemsList.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📁</div>
            <p>No database records found.</p>
            <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Create a new item above to get started.</p>
          </div>
        `;
        return;
      }

      itemsList.innerHTML = items.map(item => `
        <div class="item-card" id="item-${item.id}">
          <div class="item-details">
            <div class="item-name">${escapeHTML(item.name)}</div>
            <div class="item-description">${escapeHTML(item.description || 'No description provided.')}</div>
          </div>
          <div class="item-actions">
            <button class="btn-edit" onclick="editItem('${item.id}', '${escapeQuote(item.name)}', '${escapeQuote(item.description || '')}')">Edit</button>
            <button class="btn-danger" onclick="deleteItem('${item.id}')">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // Form submission (Create & Update)
    itemForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = itemNameInput.value.trim();
      const description = itemDescInput.value.trim();
      const id = itemIdInput.value;

      if (!name) return;

      submitBtn.disabled = true;
      submitBtn.innerHTML = isEditing ? 'Saving...' : 'Adding...';

      try {
        let response;
        if (isEditing) {
          response = await fetch(`${API_URL}/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description })
          });
        } else {
          response = await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, description })
          });
        }

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Action failed');
        }

        showToast(isEditing ? 'Item updated successfully!' : 'Item created successfully!', 'success');
        resetForm();
        fetchItems();
      } catch (error) {
        showToast(error.message, 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = isEditing ? 'Save Changes' : 'Add Item';
      }
    });

    // Edit item trigger
    function editItem(id, name, description) {
      isEditing = true;
      itemIdInput.value = id;
      itemNameInput.value = name;
      itemDescInput.value = description;
      formTitle.innerText = 'Edit Entry';
      submitBtn.innerText = 'Save Changes';
      cancelBtn.style.display = 'inline-block';
      itemNameInput.focus();
    }

    // Delete item trigger
    async function deleteItem(id) {
      if (!confirm('Are you sure you want to delete this record?')) return;

      try {
        const response = await fetch(`${API_URL}/${id}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          const errData = await response.json();
          throw new Error(errData.error || 'Delete failed');
        }

        showToast('Item deleted successfully!', 'success');
        fetchItems();
      } catch (error) {
        showToast(error.message, 'error');
      }
    }

    // Reset Form state
    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
      isEditing = false;
      itemIdInput.value = '';
      itemNameInput.value = '';
      itemDescInput.value = '';
      formTitle.innerText = 'Create New Entry';
      submitBtn.innerText = 'Add Item';
      cancelBtn.style.display = 'none';
    }

    // Show Toast
    function showToast(message, type = 'success') {
      toastMsg.innerText = message;
      toast.className = `toast show toast-${type}`;
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }

    // Helper functions for escaping
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({
          '&': '&amp;',
          '<': '&lt;',
          '>': '&gt;',
          "'": '&#39;',
          '"': '&quot;'
        }[tag] || tag)
      );
    }

    // Escape single and double quotes for JS inline argument context
    function escapeQuote(str) {
      return str.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
